<div id="glowBack" class="abs"></div>
<div id="raysBack" class="abs rays"></div>

<div id="title" class="abs gt" data-key="title" data-max="960"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="csBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b3fe4"/><stop offset="1" stop-color="#2d0f6b"/>
    </linearGradient>
    <linearGradient id="csGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a0"/><stop offset=".5" stop-color="#f5b324"/><stop offset="1" stop-color="#9a5f00"/>
    </linearGradient>
  </defs>
</svg>

<!-- Кейс: крышка поднимается при открытии. -->
<div id="crate" class="abs">
  <div id="crateBody" class="abs">
    <svg class="svg" viewBox="0 0 360 200" aria-hidden="true">
      <rect x="10" y="10" width="340" height="180" rx="22" fill="url(#csBody)" stroke="#12052e" stroke-width="6"/>
      <rect x="10" y="10" width="340" height="180" rx="22" fill="none" stroke="url(#csGold)" stroke-width="8" opacity=".9"/>
      <rect x="150" y="10" width="60" height="180" fill="url(#csGold)" opacity=".9"/>
      <rect x="140" y="70" width="80" height="60" rx="12" fill="#12052e" stroke="url(#csGold)" stroke-width="6"/>
      <circle cx="180" cy="100" r="12" fill="url(#csGold)"/>
    </svg>
  </div>
  <div id="crateLid" class="abs">
    <svg class="svg" viewBox="0 0 380 90" aria-hidden="true">
      <rect x="6" y="10" width="368" height="74" rx="20" fill="url(#csBody)" stroke="#12052e" stroke-width="6"/>
      <rect x="6" y="10" width="368" height="74" rx="20" fill="none" stroke="url(#csGold)" stroke-width="8"/>
      <rect x="160" y="10" width="60" height="74" fill="url(#csGold)"/>
    </svg>
  </div>
  <div id="crateGlow" class="abs"></div>
</div>

<div id="strip" class="abs">
  <div id="reel" class="abs"></div>
</div>
<div id="marker" class="abs"></div>

<div id="spinPill" class="abs"><span id="label"></span></div>
<div id="tapText" class="abs gt" data-key="tap" data-max="900"></div>
<div id="hand" class="abs hand"></div>
