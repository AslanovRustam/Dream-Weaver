<!-- Разметка штрафной в перспективе — под воротами и мячом. -->
<div id="pitch" class="abs">
  <svg class="svg" viewBox="0 0 1080 700" aria-hidden="true">
    <g fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="6">
      <path d="M-40 0 H1120"/>
      <path d="M140 0 L40 560 H1040 L940 0"/>
      <path d="M330 0 L300 170 H780 L750 0"/>
      <path d="M380 560 Q540 660 700 560"/>
    </g>
    <ellipse cx="540" cy="440" rx="16" ry="9" fill="#ffffff" fill-opacity=".5"/>
  </svg>
</div>
<div id="glowBack" class="abs"></div>
<div id="raysBack" class="abs rays"></div>

<div id="title" class="abs gt" data-key="title" data-max="960"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="pnPost" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd6e2"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa4b6"/>
    </linearGradient>
    <linearGradient id="pnShirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#e08a12"/>
    </linearGradient>
    <radialGradient id="pnBall" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#e9edf3"/><stop offset="1" stop-color="#9aa3b0"/>
    </radialGradient>
    <pattern id="pnNet" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M0 17 L17 0 L34 17 L17 34 Z" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2.4"/>
    </pattern>
  </defs>
</svg>

<!-- Ворота: сетка — за мячом, штанги — перед ним. -->
<div id="goal" class="abs">
  <svg class="svg" viewBox="0 0 800 470" aria-hidden="true">
    <g id="net"><rect x="22" y="22" width="756" height="448" fill="url(#pnNet)"/></g>
  </svg>
</div>
<div id="keeper" class="abs">
  <svg class="svg" viewBox="0 0 220 340" aria-hidden="true">
    <!-- ноги -->
    <path d="M86 230 L70 330 M134 230 L150 330" stroke="#1c2a48" stroke-width="30" stroke-linecap="round"/>
    <!-- руки с перчатками -->
    <path d="M60 120 L12 54 M160 120 L208 54" stroke="url(#pnShirt)" stroke-width="28" stroke-linecap="round"/>
    <circle cx="12" cy="46" r="24" fill="#2bd46a" stroke="#0f6b33" stroke-width="5"/>
    <circle cx="208" cy="46" r="24" fill="#2bd46a" stroke="#0f6b33" stroke-width="5"/>
    <!-- корпус -->
    <path d="M52 104 Q110 84 168 104 L158 240 Q110 254 62 240 Z" fill="url(#pnShirt)" stroke="#8a4a06" stroke-width="5"/>
    <text x="110" y="196" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="64" fill="#1c2a48">1</text>
    <!-- голова -->
    <circle cx="110" cy="58" r="36" fill="#f2c39a" stroke="#8a5a36" stroke-width="5"/>
    <path d="M76 52 Q110 10 144 52 Q110 36 76 52 Z" fill="#3a2414"/>
  </svg>
</div>
<div id="ball" class="abs">
  <svg class="svg" viewBox="0 0 200 200" aria-hidden="true">
    <circle cx="100" cy="100" r="94" fill="url(#pnBall)" stroke="#3a4250" stroke-width="5"/>
    <path d="M100 62 L136 88 L122 130 L78 130 L64 88 Z" fill="#1c222c"/>
    <path d="M100 62 L100 14 M136 88 L180 72 M122 130 L150 170 M78 130 L50 170 M64 88 L20 72" stroke="#1c222c" stroke-width="6"/>
    <path d="M100 14 Q130 10 158 30 L180 72 M20 72 L42 30 Q70 10 100 14 M50 170 Q100 196 150 170" fill="none" stroke="#1c222c" stroke-width="5" opacity=".6"/>
    <ellipse cx="70" cy="56" rx="24" ry="13" fill="#fff" opacity=".6" transform="rotate(-35 70 56)"/>
  </svg>
</div>
<div id="posts" class="abs">
  <svg class="svg" viewBox="0 0 800 470" aria-hidden="true">
    <path d="M22 470 V22 H778 V470" fill="none" stroke="url(#pnPost)" stroke-width="26" stroke-linejoin="round"/>
  </svg>
</div>
<div id="cornerL" class="abs"></div>
<div id="cornerR" class="abs"></div>

<div id="spinPill" class="abs"><span id="label"></span></div>
<div id="tapText" class="abs gt" data-key="tap" data-max="900"></div>
<div id="hand" class="abs hand"></div>
