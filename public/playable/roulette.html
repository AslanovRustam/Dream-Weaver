<div id="glowBack" class="abs"></div>
<div id="raysBack" class="abs rays"></div>

<div id="title" class="abs gt" data-key="title" data-max="960"></div>

<!-- Колесо собирает сценарий: 37 ячеек европейской рулетки, номера, ромбы. -->
<div id="rWheel" class="abs">
  <svg id="rDisc" class="svg" viewBox="-420 -420 840 840" aria-hidden="true"></svg>
</div>
<div id="rRim" class="abs">
  <svg class="svg" viewBox="-420 -420 840 840" aria-hidden="true">
    <defs>
      <linearGradient id="rlRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe7a3"/><stop offset=".5" stop-color="#d79a2b"/><stop offset="1" stop-color="#7a4510"/>
      </linearGradient>
    </defs>
    <circle r="410" fill="none" stroke="url(#rlRim)" stroke-width="20"/>
    <circle r="392" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="4"/>
  </svg>
</div>
<div id="rBall" class="abs"></div>
<div id="rPointer" class="abs"></div>

<div id="betChip" class="abs"><span id="betText"></span></div>
<div id="spinPill" class="abs"><span id="label"></span></div>
<div id="tapText" class="abs gt" data-key="tap" data-max="900"></div>
<div id="hand" class="abs hand"></div>
