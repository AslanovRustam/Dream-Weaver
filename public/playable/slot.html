<div id="glowBack" class="abs"></div>
<div id="raysBack" class="abs rays"></div>

<div id="title" class="abs gt" data-key="title" data-max="960"></div>

<div id="machine" class="abs">
  <!-- корпус: золотая рама, тёмная панель, огни по верху -->
  <svg class="svg abs fill" viewBox="0 0 900 860" aria-hidden="true">
    <defs>
      <linearGradient id="slRim" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff0b8"/><stop offset=".3" stop-color="#e2a23e"/><stop offset=".65" stop-color="#7a3e10"/><stop offset="1" stop-color="#f2c26a"/>
      </linearGradient>
      <linearGradient id="slBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7a1030"/><stop offset=".55" stop-color="#3e0718"/><stop offset="1" stop-color="#1c030b"/>
      </linearGradient>
      <linearGradient id="slTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a2f9a"/><stop offset="1" stop-color="#1a0d44"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="900" height="860" rx="70" fill="#1a0b04"/>
    <rect x="8" y="8" width="884" height="844" rx="64" fill="url(#slRim)"/>
    <rect x="30" y="30" width="840" height="800" rx="48" fill="url(#slBody)"/>
    <rect x="60" y="48" width="780" height="98" rx="40" fill="url(#slTop)" stroke="#f2c26a" stroke-width="5"/>
    <!-- окно барабанов с толстой рамой -->
    <rect x="44" y="160" width="812" height="632" rx="34" fill="url(#slRim)"/>
    <rect x="58" y="174" width="784" height="604" rx="26" fill="#0c0306"/>
  </svg>
  <div id="slBulbs" class="abs"></div>
  <div id="slWindow" class="abs">
    <div class="reel" id="reel0"><div class="strip"></div></div>
    <div class="reel" id="reel1"><div class="strip"></div></div>
    <div class="reel" id="reel2"><div class="strip"></div></div>
    <div id="slShade" class="abs fill"></div>
    <div id="payline" class="abs"></div>
  </div>
  <div class="arrow abs l"></div>
  <div class="arrow abs r"></div>
</div>

<div id="lever" class="abs">
  <div id="leverArm" class="abs"><i class="stick"></i><i class="ball"></i></div>
  <div class="mount abs"></div>
</div>

<div id="spinPill" class="abs"><span id="label"></span></div>
<div id="tapText" class="abs gt" data-key="tap" data-max="900"></div>
<div id="hand" class="abs hand"></div>
